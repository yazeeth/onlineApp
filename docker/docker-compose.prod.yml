services:
  postgres:
    image: postgres:17
    container_name: onlineshop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: onlineshop
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppassword

    ports:
      - "5432:5432"

    volumes:
      - onlineshop-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d onlineshop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: yazeeth/onlineshop-backend:1.0.0
    container_name: onlineshop-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://shopuser:shoppassword@postgres:5432/onlineshop?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: http://localhost:5173

    ports:
      - "5050:5050"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: yazeeth/onlineshop-frontend:1.0.0
    container_name: onlineshop-frontend
    restart: unless-stopped

    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:5050}

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  onlineshop-postgres-data:
